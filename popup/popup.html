<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>FB Feed Only</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="../icons/icon-128.png" alt="" />
      <div class="title">
        <h1>FB Feed Only</h1>
        <p>Chỉ giữ lại News Feed</p>
      </div>
      <span class="status" id="status" aria-live="polite">Đang tắt</span>
    </header>

    <main class="card">
      <label class="row">
        <span class="row-icon danger" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.6-.8L3 21l1.9-5.4A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z" />
            <path d="M4 4l16 16" />
          </svg>
        </span>
        <span class="row-text">
          <strong>Ẩn tin nhắn &amp; chat</strong>
          <span>Messenger, chat, danh bạ</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" id="hideMessages" />
          <span class="track"></span>
        </span>
      </label>

      <label class="row">
        <span class="row-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M9 4v16" />
            <path d="M5.5 8h1M5.5 11h1M5.5 14h1" />
          </svg>
        </span>
        <span class="row-text">
          <strong>Ẩn menu bên trái</strong>
          <span>Chỉ còn News Feed ở giữa</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" id="hideLeftNav" />
          <span class="track"></span>
        </span>
      </label>
    </main>

    <footer class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
      </svg>
      <span>Áp dụng ngay, không cần tải lại trang</span>
      <span class="version" id="version"></span>
    </footer>

    <script src="../src/rules.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
