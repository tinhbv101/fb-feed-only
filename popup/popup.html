<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>FB Feed Only</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="people-panel.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="../icons/icon-128.png" alt="" />
      <div class="title">
        <h1>FB Feed Only</h1>
        <p>Chỉ giữ lại News Feed</p>
      </div>
      <span class="status" id="status" aria-live="polite">Đang tắt</span>
    </header>

    <h2 class="section-title">Tin nhắn</h2>
    <fieldset class="card modes" id="modes">
      <legend class="visually-hidden">Chế độ tin nhắn</legend>
      <label class="mode">
        <input type="radio" name="messageMode" value="off" />
        <span class="mode-text"><strong>Hiện bình thường</strong></span>
      </label>
      <label class="mode">
        <input type="radio" name="messageMode" value="hideAll" />
        <span class="mode-text"><strong>Ẩn tất cả</strong><span>Messenger, chat, danh bạ</span></span>
      </label>
      <label class="mode">
        <input type="radio" name="messageMode" value="block" />
        <span class="mode-text"><strong>Ẩn người đã chọn</strong><span>Những người khác vẫn hiện</span></span>
      </label>
      <label class="mode">
        <input type="radio" name="messageMode" value="allow" />
        <span class="mode-text"><strong>Chỉ hiện người đã chọn</strong><span>Những người khác bị ẩn</span></span>
      </label>
    </fieldset>

    <section class="card people" id="people" hidden>
      <div class="people-head">
        <strong id="peopleTitle">Người bị ẩn</strong>
        <span class="people-count" id="peopleCount"></span>
        <button type="button" class="link-button" id="clearSelection">Bỏ chọn hết</button>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
        <input type="search" id="peopleSearch" placeholder="Tìm theo tên..." aria-label="Tìm theo tên" autocomplete="off" />
      </div>

      <ul class="people-list" id="peopleList" aria-label="Danh sách người"></ul>
      <p class="people-empty" id="peopleEmpty" hidden></p>

      <form class="add-form" id="addForm">
        <input type="text" id="addInput" placeholder="Dán link cuộc trò chuyện" aria-label="Link cuộc trò chuyện" autocomplete="off" />
        <button type="submit">Thêm</button>
      </form>
      <p class="add-error" id="addError" role="alert" hidden></p>

      <div class="people-foot">
        <span id="peopleTotal"></span>
        <button type="button" class="link-button danger" id="clearPeople">Xoá danh sách</button>
      </div>
    </section>

    <h2 class="section-title">Giao diện</h2>
    <div class="card">
      <label class="row">
        <span class="row-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M9 4v16" />
            <path d="M5.5 8h1M5.5 11h1M5.5 14h1" />
          </svg>
        </span>
        <span class="row-text">
          <strong>Ẩn menu bên trái</strong>
          <span>Chỉ còn News Feed ở giữa</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" id="hideLeftNav" />
          <span class="track"></span>
        </span>
      </label>
    </div>

    <footer class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
      </svg>
      <span>Áp dụng ngay, không cần tải lại trang</span>
      <span class="version" id="version"></span>
    </footer>

    <script src="../src/rules.js"></script>
    <script src="../src/people-rules.js"></script>
    <script src="../src/storage.js"></script>
    <script src="people-panel.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
